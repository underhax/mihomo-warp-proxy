name: mihomo-warp-proxy

services:
  mihomo:
    image: ghcr.io/underhax/mihomo-warp-proxy:${MWP_VERSION:-latest}${MIHOMO_CPU_VARIANT:+-amd64${MIHOMO_CPU_VARIANT}}
    container_name: mihomo
    hostname: mihomo
    restart: always
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    ipc: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    env_file:
      - .env
    volumes:
      - ./data:/app/mihomo:rw,noexec,nosuid,nodev
      - ./wgcf:/app/wgcf:rw,noexec,nosuid,nodev
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /run:mode=1777,size=16m,noexec,nosuid,nodev
      - /tmp:mode=1777,size=64m,noexec,nosuid,nodev
    networks:
      - frontend_gateway
    # ports:
    #   - "${HOST_BIND_IP}:${PROXY_PORT}:${PROXY_PORT}"
    healthcheck:
      test:
        - "CMD"
        - "/usr/local/bin/entrypoint"
        - "health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10M"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 100
    mem_reservation: 128m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 512
        hard: 512
    secrets:
      - mwp_proxy_user
      - mwp_proxy_pass
    #   - mwp_geo_auth_user
    #   - mwp_geo_auth_pass
    #   - mwp_warp_plus_key

secrets:
  mwp_proxy_user:
    file: ./secrets/mwp_proxy_user
  mwp_proxy_pass:
    file: ./secrets/mwp_proxy_pass
  # mwp_geo_auth_user:
  #   file: ./secrets/mwp_geo_auth_user
  # mwp_geo_auth_pass:
  #   file: ./secrets/mwp_geo_auth_pass
  # mwp_warp_plus_key:
  #   file: ./secrets/mwp_warp_plus_key

networks:
  frontend_gateway:
    external: true
