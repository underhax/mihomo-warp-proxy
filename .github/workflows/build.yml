name: Build and Publish Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mihomo_ver:  ${{ steps.extract.outputs.mihomo_ver }}
      wgcf_ver:    ${{ steps.extract.outputs.wgcf_ver }}
      alpine_dig:  ${{ steps.extract.outputs.alpine_dig }}
      go_dig:      ${{ steps.extract.outputs.go_dig }}
      image_base:  ${{ steps.extract.outputs.image_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract versions from Dockerfile
        id: extract
        run: |
          MIHOMO_VER=$(awk -F'[:@]' '/FROM metacubex\/mihomo/ {gsub(/^v/, "", $2); print $2}' Dockerfile)
          WGCF_VER=$(awk -F'[:@]' '/FROM virb3\/wgcf/ {gsub(/^v/, "", $2); print $2}' Dockerfile)
          ALPINE_DIG=$(awk -F'[@ ]' '/FROM alpine:/ {print $3}' Dockerfile)
          GO_DIG=$(awk -F'[@ ]' '/golang:/ {for(i=1;i<=NF;i++) if($i ~ /^sha256:/) print $i}' Dockerfile)
          IMAGE_BASE=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')

          [ -n "${MIHOMO_VER}" ] || { echo "ERROR: failed to parse Mihomo version"; exit 1; }
          [ -n "${WGCF_VER}" ]   || { echo "ERROR: failed to parse Wgcf version"; exit 1; }
          [ -n "${ALPINE_DIG}" ] || { echo "ERROR: failed to parse Alpine digest"; exit 1; }
          [ -n "${GO_DIG}" ]     || { echo "ERROR: failed to parse Go digest"; exit 1; }

          echo "mihomo_ver=${MIHOMO_VER}" >> "$GITHUB_OUTPUT"
          echo "wgcf_ver=${WGCF_VER}"     >> "$GITHUB_OUTPUT"
          echo "alpine_dig=${ALPINE_DIG}" >> "$GITHUB_OUTPUT"
          echo "go_dig=${GO_DIG}"         >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.cpu_variant || 'default' }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cpu_variant: v1
            push_tag_suffix: -amd64v1

          - platform: linux/amd64
            cpu_variant: v2
            push_tag_suffix: -amd64v2

          - platform: linux/amd64
            cpu_variant: v3
            push_tag_suffix: -amd64v3

          - platform: linux/arm64
            cpu_variant: ""
            push_tag_suffix: -arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ needs.prepare.outputs.image_base }}:${{ needs.prepare.outputs.mihomo_ver }}${{ matrix.push_tag_suffix }}
          provenance: false
          build-args: |
            MIHOMO_VERSION=${{ needs.prepare.outputs.mihomo_ver }}
            WGCF_VERSION=${{ needs.prepare.outputs.wgcf_ver }}
            MIHOMO_CPU_VARIANT=${{ matrix.cpu_variant }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.mihomo_ver }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Cloudflare WARP SOCKS5/HTTP(S) proxy via mihomo (Clash Meta)
            dev.wgcf.version=${{ needs.prepare.outputs.wgcf_ver }}
            dev.alpine.digest=${{ needs.prepare.outputs.alpine_dig }}
            dev.golang.digest=${{ needs.prepare.outputs.go_dig }}

  merge:
    name: Merge fat manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create default fat manifest (amd64v1 + arm64)
        run: |
          BASE=${{ needs.prepare.outputs.image_base }}
          VER=${{ needs.prepare.outputs.mihomo_ver }}

          docker buildx imagetools create \
            --tag "${BASE}:${VER}" \
            --tag "${BASE}:latest" \
            "${BASE}:${VER}-amd64v1" \
            "${BASE}:${VER}-arm64"

      - name: Create versioned tags for v2 and v3
        run: |
          BASE=${{ needs.prepare.outputs.image_base }}
          VER=${{ needs.prepare.outputs.mihomo_ver }}

          docker buildx imagetools create \
            --tag "${BASE}:${VER}-amd64v2" \
            --tag "${BASE}:latest-amd64v2" \
            "${BASE}:${VER}-amd64v2"

          docker buildx imagetools create \
            --tag "${BASE}:${VER}-amd64v3" \
            --tag "${BASE}:latest-amd64v3" \
            "${BASE}:${VER}-amd64v3"
