name: Build and Publish Docker Image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mihomo_ver:  ${{ steps.extract.outputs.mihomo_ver }}
      wgcf_ver:    ${{ steps.extract.outputs.wgcf_ver }}
      go_dig:      ${{ steps.extract.outputs.go_dig }}
      image_base:  ${{ steps.extract.outputs.image_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract versions from Dockerfile
        id: extract
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE_BASE=$(printf '%s\n' "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
          MIHOMO_VER=$(sed -nE 's|^FROM metacubex/mihomo:v?([0-9]+\.[0-9]+\.[0-9]+).* AS mihomo$|\1|p' Dockerfile)
          WGCF_VER=$(sed -nE 's|^FROM virb3/wgcf:v?([0-9]+\.[0-9]+\.[0-9]+).* AS wgcf$|\1|p' Dockerfile)
          GO_DIG=$(sed -nE 's|^FROM --platform=\$BUILDPLATFORM golang:[^@]+@sha256:([a-f0-9]{64}).* AS builder$|\1|p' Dockerfile)

          if [[ ! "$MIHOMO_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ERROR: invalid or missing Mihomo version: %s\n' "$MIHOMO_VER" >&2
            exit 1
          fi

          if [[ ! "$WGCF_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'ERROR: invalid or missing Wgcf version: %s\n' "$WGCF_VER" >&2
            exit 1
          fi

          if [[ ! "$GO_DIG" =~ ^[a-f0-9]{64}$ ]]; then
            printf 'ERROR: invalid or missing Go digest: %s\n' "$GO_DIG" >&2
            exit 1
          fi

          printf 'mihomo_ver=%s\n' "$MIHOMO_VER" >> "$GITHUB_OUTPUT"
          printf 'wgcf_ver=%s\n' "$WGCF_VER" >> "$GITHUB_OUTPUT"
          printf 'go_dig=%s\n' "$GO_DIG" >> "$GITHUB_OUTPUT"
          printf 'image_base=%s\n' "$IMAGE_BASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.cpu_variant || 'default' }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cpu_variant: v1
            push_tag_suffix: -amd64v1

          - platform: linux/amd64
            cpu_variant: v2
            push_tag_suffix: -amd64v2

          - platform: linux/amd64
            cpu_variant: v3
            push_tag_suffix: -amd64v3

          - platform: linux/arm64
            cpu_variant: ""
            push_tag_suffix: -arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ needs.prepare.outputs.image_base }}:${{ needs.prepare.outputs.mihomo_ver }}${{ matrix.push_tag_suffix }}
          provenance: false
          build-args: |
            MIHOMO_VERSION=${{ needs.prepare.outputs.mihomo_ver }}
            WGCF_VERSION=${{ needs.prepare.outputs.wgcf_ver }}
            MIHOMO_CPU_VARIANT=${{ matrix.cpu_variant }}
          labels: |
            org.opencontainers.image.title=Mihomo WARP Proxy
            org.opencontainers.image.description=Cloudflare WARP SOCKS5/HTTP(S) proxy via mihomo on scratch
            org.opencontainers.image.version=${{ needs.prepare.outputs.mihomo_ver }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            dev.wgcf.version=${{ needs.prepare.outputs.wgcf_ver }}
            dev.golang.digest=${{ needs.prepare.outputs.go_dig }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Merge fat manifests
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create default fat manifest (amd64v1 + arm64)
        env:
          BASE: ${{ needs.prepare.outputs.image_base }}
          VER: ${{ needs.prepare.outputs.mihomo_ver }}
        run: |
          docker buildx imagetools create \
            --tag "${BASE}:${VER}" \
            --tag "${BASE}:latest" \
            "${BASE}:${VER}-amd64v1" \
            "${BASE}:${VER}-arm64"

      - name: Create versioned tags for v2 and v3
        env:
          BASE: ${{ needs.prepare.outputs.image_base }}
          VER: ${{ needs.prepare.outputs.mihomo_ver }}
        run: |
          docker buildx imagetools create \
            --tag "${BASE}:${VER}-amd64v2" \
            --tag "${BASE}:latest-amd64v2" \
            "${BASE}:${VER}-amd64v2"

          docker buildx imagetools create \
            --tag "${BASE}:${VER}-amd64v3" \
            --tag "${BASE}:latest-amd64v3" \
            "${BASE}:${VER}-amd64v3"
