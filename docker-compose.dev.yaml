name: mihomo-warp-proxy-dev

services:
  mihomo:
    build:
      context: .
      args:
        # v1 = baseline x86-64, v2 = SSE4.2, v3 = AVX2.
        # To detect your level:
        #   awk '/flags/{if (/avx2/) {print "v3"; exit} if (/sse4_2/) {print "v2"; exit} print "v1"; exit}' /proc/cpuinfo
        MIHOMO_CPU_VARIANT: ${MIHOMO_CPU_VARIANT:-v1}
    image: mihomo-warp-proxy-dev:local
    pull_policy: never
    container_name: mihomo-dev
    hostname: mihomo-dev
    restart: on-failure:3
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    ipc: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    env_file:
      - .env
    volumes:
      - ./data:/app/mihomo:rw,noexec,nosuid,nodev
      - ./wgcf:/app/wgcf:rw,noexec,nosuid,nodev
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /run:mode=1777,size=16m,noexec,nosuid,nodev
      - /tmp:mode=1777,size=64m,noexec,nosuid,nodev
    networks:
      - mihomo_dev
    environment:
      - SCRIPT_LOG_LEVEL=DEBUG
      - PROXY_LOG_LEVEL=debug
    healthcheck:
      test:
        - "CMD"
        - "/usr/local/bin/entrypoint"
        - "health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10M"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 100
    mem_reservation: 128m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 512
        hard: 512
    # secrets:
    #   - mwp_proxy_user
    #   - mwp_proxy_pass
    #   - mwp_geo_auth_user
    #   - mwp_geo_auth_pass
    #   - mwp_warp_plus_key

# secrets:
#   mwp_proxy_user:
#     file: ./secrets/mwp_proxy_user
#   mwp_proxy_pass:
#     file: ./secrets/mwp_proxy_pass
  # mwp_geo_auth_user:
  #   file: ./secrets/mwp_geo_auth_user
  # mwp_geo_auth_pass:
  #   file: ./secrets/mwp_geo_auth_pass
  # mwp_warp_plus_key:
  #   file: ./secrets/mwp_warp_plus_key

networks:
  mihomo_dev:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
